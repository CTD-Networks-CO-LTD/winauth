name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. 3.6.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build WinAuth.YubiKey Native DLLs (x86 / x64)
        shell: pwsh
        run: |
          msbuild "WinAuth.YubiKey/WinAuth.YubiKey.x86.vcxproj" /p:Configuration=Release /p:Platform=Win32
          msbuild "WinAuth.YubiKey/WinAuth.YubiKey.x64.vcxproj" /p:Configuration=Release /p:Platform=x64

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore and Test
        shell: pwsh
        run: |
          dotnet restore WinAuth.sln
          dotnet test WinAuth.sln -c Release --no-restore

      - name: Publish WinAuth.exe and Create WinAuth-{tag}.zip
        env:
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
        shell: pwsh
        run: |
          if ($env:RAW_TAG -notmatch '^[0-9A-Za-z._-]+$') {
            throw "Invalid tag name format: $env:RAW_TAG"
          }
          $tag = $env:RAW_TAG
          $ver = ($tag -replace '^[vV]', '')
          $verProps = @()
          if ($ver -match '^\d+\.\d+\.\d+(\.\d+)?$') {
            $verProps += "-p:Version=$ver"
          }

          dotnet publish "WinAuth/WinAuth.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            @verProps `
            -o "./publish"

          if (-not (Test-Path "./publish/WinAuth.exe")) {
            throw "WinAuth.exe was not generated."
          }

          $zipName = "WinAuth-$tag.zip"
          Compress-Archive -LiteralPath "./publish/WinAuth.exe" -DestinationPath "./$zipName" -Force

          $hash = (Get-FileHash -LiteralPath "./$zipName" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -LiteralPath "./$zipName.sha256" -Encoding ASCII

          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_NAME=$zipName"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$tag"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ./${{ env.ZIP_NAME }}
            ./${{ env.ZIP_NAME }}.sha256
          overwrite: true

      - name: Upload Assets to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "$env:RELEASE_TAG" "./$env:ZIP_NAME" "./$env:ZIP_NAME.sha256" --clobber


