name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. 3.6.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build WinAuth.YubiKey Native DLLs (x86 / x64)
        shell: pwsh
        run: |
          msbuild "WinAuth.YubiKey/WinAuth.YubiKey.x86.vcxproj" /p:Configuration=Release /p:Platform=Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild "WinAuth.YubiKey/WinAuth.YubiKey.x64.vcxproj" /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "Authenticator/Resources/WinAuth.YubiKey.x86.dll") -or -not (Test-Path "Authenticator/Resources/WinAuth.YubiKey.x64.dll")) {
            throw "Expected YubiKey native DLLs were not generated."
          }

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore and Test
        shell: pwsh
        run: |
          dotnet restore WinAuth.sln
          dotnet test WinAuth.sln -c Release --no-restore

      - name: Publish WinAuth.exe and Create Release Archives
        env:
          RAW_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
        shell: pwsh
        run: |
          if ($env:RAW_TAG -notmatch '^[0-9A-Za-z._-]+$') {
            throw "Invalid tag name format: $env:RAW_TAG"
          }
          $tag = $env:RAW_TAG
          $verProps = @()
          $xmlVersion = "4.0"
          if ($tag -match '^[vV]?(\d+\.\d+\.\d+(?:\.\d+)?)') {
            $ver = $Matches[1]
            $ver4 = if ($ver.Split('.').Length -eq 3) { "$ver.0" } else { $ver }
            $verParts = $ver.Split('.')
            $xmlVersion = "$($verParts[0]).$($verParts[1])"
            $verProps += "-p:Version=$ver"
            $verProps += "-p:AssemblyVersion=$ver4"
            $verProps += "-p:FileVersion=$ver4"
            $verProps += "-p:InformationalVersion=$ver"
          }

          dotnet publish "WinAuth/WinAuth.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            @verProps `
            -o "./publish"

          if (-not (Test-Path "./publish/WinAuth.exe")) {
            throw "WinAuth.exe was not generated."
          }

          $zipName = "WinAuth-$tag.zip"
          Compress-Archive -LiteralPath "./publish/WinAuth.exe" -DestinationPath "./$zipName" -Force

          $portableDir = "./portable"
          if (Test-Path $portableDir) {
            Remove-Item -LiteralPath $portableDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          $xmlLines = @(
            '<?xml version="1.0" encoding="utf-8"?>'
            "<WinAuth version=`"$xmlVersion`">"
            '</WinAuth>'
          )
          $xmlContent = ($xmlLines -join "`r`n") + "`r`n"
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path $portableDir).Path "winauth.xml"), $xmlContent, [System.Text.UTF8Encoding]::new($false))

          $portableZipName = "WinAuth-$tag-portable.zip"
          Compress-Archive -LiteralPath "./publish/WinAuth.exe", "$portableDir/winauth.xml" -DestinationPath "./$portableZipName" -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $stdZip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "./$zipName").Path)
          try {
            $stdEntries = @($stdZip.Entries | ForEach-Object { $_.FullName })
            if ($stdEntries.Count -ne 1 -or $stdEntries[0] -ne "WinAuth.exe") {
              throw "Unexpected entries in $zipName : $($stdEntries -join ', ')"
            }
          } finally {
            $stdZip.Dispose()
          }

          $portZip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "./$portableZipName").Path)
          try {
            $portEntries = @($portZip.Entries | ForEach-Object { $_.FullName } | Sort-Object)
            if ($portEntries.Count -ne 2 -or $portEntries[0] -ne "WinAuth.exe" -or $portEntries[1] -ne "winauth.xml") {
              throw "Unexpected entries in $portableZipName : $($portEntries -join ', ')"
            }
          } finally {
            $portZip.Dispose()
          }

          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_NAME=$zipName"
          Add-Content -Path $env:GITHUB_ENV -Value "PORTABLE_ZIP_NAME=$portableZipName"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_TAG=$tag"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WinAuth-${{ env.RELEASE_TAG }}
          path: |
            ./${{ env.ZIP_NAME }}
            ./${{ env.PORTABLE_ZIP_NAME }}
          overwrite: true

      - name: Upload Assets to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "$env:RELEASE_TAG" "./$env:ZIP_NAME" "./$env:PORTABLE_ZIP_NAME" --clobber


